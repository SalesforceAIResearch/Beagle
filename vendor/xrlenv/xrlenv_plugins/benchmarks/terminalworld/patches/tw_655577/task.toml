# PATCH (coding-bench): the task image declares ``USER delicate`` (non-root), but
# tests/test.sh runs ``apt-get install curl`` + ``curl … uv | sh`` + ``uvx`` —
# all of which need root. harbor runs the verifier as ``task.config.verifier.user``
# (default None → the image's USER), so upstream it fails with apt "Permission
# denied" + "uvx: command not found". Setting the verifier user to root (the
# Terminal-Bench convention) lets test.sh bootstrap uv and run pytest.
[verifier]
timeout_sec = 900.0
user = "root"

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 900.0
cpus = 1
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
