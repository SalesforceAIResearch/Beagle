# Worked example — own benchmark via Path 2 (External pip package, B11.6).
#
# echo_bench is the simplest possible new-benchmark plug-in: agent
# receives a target string in the initial observation, must echo it
# back; reward 1.0 on exact match, 0.0 otherwise. Built on
# python:3.12-slim; total smoke time ~30 s.
#
# Read examples/pip_new_datasets_or_benchmark/README.md first if you're
# trying to decide whether scenario 1 (this) or scenario 2
# (byo_dataset_harbor/) matches your data.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xrlenv-echo-bench"
version = "0.1.0"
description = "B11.6 worked example — own-benchmark pip package (scenario 1)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "XRLEnv", email = "noreply@example.com" }]
dependencies = [
    # The xrlenv core SDK is the only runtime dep. Version constraint
    # left open so this worked example survives pre-1.0 churn; pin
    # tighter (e.g. ``"xrlenv>=0.5,<2"``) when shipping a real
    # external benchmark.
    "xrlenv",
]

# B11.2 — register this plug-in's manifest with xrlenv's discovery
# mechanism. The entry-point key is the human-readable plug-in name;
# the value points at a callable returning the manifest.yaml path.
[project.entry-points."xrlenv.benchmarks"]
echo_bench = "xrlenv_plugins.benchmarks.echo_bench.plugin:plugin_manifests"

# Hatchling needs to know which top-level packages to ship. The
# ``xrlenv_plugins`` namespace contribution must be listed
# explicitly because it's a PEP-420 namespace package (no
# __init__.py at the namespace levels).
[tool.hatch.build.targets.wheel]
packages = ["xrlenv_plugins"]

# Force-include non-Python plug-in payload (manifest, in-package
# scripts) so they reach the installed wheel. The grader script
# (run-echo-tests.sh) and the Dockerfile live inside the namespace
# package at xrlenv_plugins/benchmarks/echo_bench/scripts/ so
# importlib.resources.files() resolves them uniformly in both
# editable and wheel installs. The operator-facing
# scripts/build-task-images.sh stays outside the wheel — it's a
# host-side tool the operator runs from the source checkout.
[tool.hatch.build.targets.wheel.force-include]
"xrlenv_plugins/benchmarks/echo_bench/manifest.yaml" = "xrlenv_plugins/benchmarks/echo_bench/manifest.yaml"
"xrlenv_plugins/benchmarks/echo_bench/scripts" = "xrlenv_plugins/benchmarks/echo_bench/scripts"
