# Example cluster topology — the source of truth for the deployment generator.
# Copy this to describe your own cluster, then synchronize the deploy scripts:
#
#   python slurm_scripts/generate_deployment_script.py               # sync scripts
#   python slurm_scripts/generate_deployment_script.py --env-cluster example  # sync .env
#
# Field reference is in README.md. Hostnames below are placeholders — replace
# them with your cluster's Slurm hostnames. Ports default to 5010 (mirror) /
# 5011 (private) if omitted.
example:
  control_plane: control-plane.example
  registry:
    mirror_host: registry.example
    private_host: registry.example
    mirror_port: 5010
    private_port: 5011
  workers:
    - worker-1.example
    - worker-2.example
  sysbox_pool:
    - worker-1.example
  cpu_isolation_pool:
    - worker-2.example
