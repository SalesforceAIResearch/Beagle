# Example runtime node inventory. Normally regenerated by the control job's
# `xrlenv nodes-from-slurm` at startup — this file just documents the schema.
# Hosts and pool assignments below are placeholders; see clusters.yaml + README.
version: 1
nodes:
  - id: aws-worker-1
    cloud: aws
    backends:
      - docker
    auth_token_env: XRLENV_NODE_TOKEN
    address: worker-1.example
    sysbox: true
    max_concurrent_by_runtime:
      sysbox-runc: 4
  - id: aws-worker-2
    cloud: aws
    backends:
      - docker
    auth_token_env: XRLENV_NODE_TOKEN
    address: worker-2.example
policy:
  allowed_devices:
    - /dev/kvm
    - /dev/net/tun
    - /dev/fuse
  denied_caps: []
  allow_host_network: false
  allow_privileged: false
  allowed_host_paths:
    - /path/to/host-cache
  allowed_runtimes:
    - sysbox-runc
