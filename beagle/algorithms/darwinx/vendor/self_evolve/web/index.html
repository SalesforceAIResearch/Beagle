// ─── Active pipelines ───────────────────────────────────────────────
function _heartbeatAgeLabel(ts) {
  if (!ts) return 'no heartbeat';
  const parsed = Date.parse(ts);
  if (!Number.isFinite(parsed)) return 'heartbeat unknown';
  const seconds = Math.max(0, Math.floor((Date.now() - parsed) / 1000));
  if (seconds < 90) return `${seconds}s ago`;
  const minutes = Math.floor(seconds / 60);
  if (minutes < 90) return `${minutes}m ago`;
  const hours = Math.floor(minutes / 60);
  return `${hours}h ago`;
}

function _pipelineStatusText(p) {
  const state = p.liveness_state || (p.is_stale ? 'stale_heartbeat_unknown' : 'running');
  if (state === 'running_mini_eval' || state === 'running_mini_eval_heartbeat_delayed') {
    return 'running mini-eval';
  }
  if (state === 'running_full_eval' || state === 'running_full_eval_heartbeat_delayed') {
    return 'running full eval';
  }
  if (state === 'running_subset_final' || state === 'running_subset_final_heartbeat_delayed') {
    return 'running subset final eval';
  }
  if (state === 'running_heartbeat_delayed') return 'heartbeat delayed';
  if (state === 'orphaned') return 'orphaned';
  if (state === 'stale_heartbeat_unknown') return 'possibly orphaned';
  return p.status || state;
}

function _pipelineStatusClass(p) {
  const state = p.liveness_state || '';
  if (state === 'orphaned') return 'text-red-400';
  if (state === 'running_mini_eval' || state === 'running_mini_eval_heartbeat_delayed' ||
      state === 'running_full_eval' || state === 'running_full_eval_heartbeat_delayed' ||
      state === 'running_subset_final' || state === 'running_subset_final_heartbeat_delayed') return 'text-emerald-300';
  if (state === 'running_heartbeat_delayed' || state === 'stale_heartbeat_unknown') return 'text-amber-300';
  return 'text-gray-500';
}

function _evalProgressText(p) {
  if (!p.eval_active && p.eval_finished_at === undefined && p.eval_n_trials === undefined) return '';
  const parts = [];
  if (p.eval_n_trials !== undefined && p.eval_n_total_trials !== undefined && p.eval_n_total_trials !== null) {
    parts.push(`${p.eval_n_trials}/${p.eval_n_total_trials} trials`);
  } else if (p.eval_n_trials !== undefined && p.eval_n_trials !== null) {
    parts.push(`${p.eval_n_trials} trials`);
  }
  if (p.eval_score !== undefined && p.eval_score !== null) {
    parts.push(`mean ${Number(p.eval_score).toFixed(3)}`);
  }
  if (p.eval_n_errors !== undefined && p.eval_n_errors !== null) {
    parts.push(`${p.eval_n_errors} errors`);
  }
  if (!parts.length && p.eval_job_path) {
    if (p.eval_kind === 'full_eval') return 'full eval starting';
    if (p.eval_kind === 'subset_final') return 'subset final eval starting';
    return 'mini-eval starting';
  }
  return parts.join(' · ');
}

function _activePipelineCard(p) {
  const statusText = _pipelineStatusText(p);
  const statusClass = _pipelineStatusClass(p);
  const progress = _evalProgressText(p);
  const targetNodeId = p.child_node_id || null;
  const clickAttrs = targetNodeId
    ? ` data-node-id="${escapeHtml(targetNodeId)}" onclick="selectNode(this.dataset.nodeId, { scrollIntoView: true })" title="Click to inspect child node ${escapeHtml(targetNodeId)}"`
    : '';
  const cardClass = targetNodeId ? 'cursor-pointer hover:bg-[#1a2030]' : '';
  const heartbeat = p.heartbeat_stale
    ? `<div class="text-xs text-amber-400">last heartbeat ${escapeHtml(_heartbeatAgeLabel(p.heartbeat_at))}</div>`
    : '';
  const reason = p.liveness_reason
    ? `<div class="text-xs text-gray-500">${escapeHtml(p.liveness_reason)}</div>`
    : '';
  const border = p.liveness_state === 'orphaned'
    ? 'border-red-900'
    : ((p.is_stale || p.heartbeat_stale) ? 'border-amber-900' : '');
  return `
    <div class="pane p-2 ${border} ${cardClass}"${clickAttrs}>
      <div class="flex items-center justify-between text-xs">
        <code>${escapeHtml(p.id)}</code>
        <span class="${statusClass}">${escapeHtml(statusText)}</span>
      </div>
      <div class="text-xs text-gray-400">
        ${p.child_node_id ? `child ${escapeHtml(p.child_node_id)}` : 'no child yet'}
        ${p.parent_node_id ? ` · parent ${escapeHtml(p.parent_node_id)}` : ''}
      </div>
      <div class="text-xs text-gray-500">iter ${escapeHtml(String(p.current_iteration ?? 0))} · ${escapeHtml((p.selected_tasks || []).join(', '))}</div>
      ${progress ? `<div class="text-xs text-emerald-300">${escapeHtml(progress)}</div>` : ''}
      ${heartbeat}
      ${reason}
      <div class="pip-bar mt-1"><div style="width: ${Math.min(100, (p.current_iteration || 0) * 10)}%"></div></div>
    </div>
  `;
}

function _preflightStatusText(p) {
  if (!p) return '';
  if (p.status === 'running') return 'running';
  if (p.status === 'completed') return (p.eval_n_errors || 0) > 0 ? 'errors' : 'passed';
  if (p.status === 'failed') return 'failed';
  if (p.status === 'stale') return 'stale';
  return p.status || 'unknown';
}

function _preflightStatusClass(p) {
  if (!p) return 'text-gray-500';
  if (p.status === 'completed' && (p.eval_n_errors || 0) === 0) return 'text-emerald-300';
  if (p.status === 'running') return 'text-sky-300';
  if (p.status === 'failed' || p.status === 'stale' || (p.eval_n_errors || 0) > 0) return 'text-amber-300';
  return 'text-gray-500';
}

function _preflightPassed(p) {
  return p?.status === 'completed' && (p.eval_n_errors || 0) === 0;
}

function _preflightMiniEvalCard(p) {
  if (!p) return '';
  const progress = _evalProgressText({
    eval_active: p.status === 'running',
    eval_kind: 'mini_eval',
    eval_job_path: p.result_path || p.job_name,
    eval_n_trials: p.eval_n_trials,
    eval_n_total_trials: p.eval_n_total_trials || p.n_total_trials,
    eval_n_errors: p.eval_n_errors,
    eval_score: p.eval_score,
    eval_finished_at: p.eval_finished_at,
  });
  const warning = (p.status === 'completed' && (p.eval_n_errors || 0) > 0)
    ? '<div class="text-xs text-amber-300">check preflight log</div>'
    : '';
  return `
    <div class="pane preflight-card p-2 border-sky-900">
      <div class="preflight-head text-xs">
        <span class="preflight-label">Mini-eval preflight</span>
        <span class="preflight-status ${_preflightStatusClass(p)}">${escapeHtml(_preflightStatusText(p))}</span>
      </div>
      ${progress ? `<div class="preflight-text text-xs text-emerald-300">${escapeHtml(progress)}</div>` : ''}
      ${warning}
    </div>
  `;
}

async function refreshActive() {
  try {
    const res = await api('/api/pipelines/active');
    const preflight = $('#preflight-mini-eval');
    const preflightState = res.preflight_mini_eval;
    const preflightHtml = preflightState ? _preflightMiniEvalCard(preflightState) : '';
    const preflightPassed = _preflightPassed(preflightState);
    preflight.innerHTML = preflightHtml && !preflightPassed ? preflightHtml : '';
    const c = $('#active-pipelines');
    const liveRows = res.rows || [];
    const staleRows = res.stale_rows || [];
    const completedPreflightHtml = preflightHtml && preflightPassed ? preflightHtml : '';
    if (!liveRows.length && !staleRows.length) {
      c.innerHTML = '<div class="text-xs text-gray-600 px-2">none running</div>' + completedPreflightHtml;
      return;
    }
    const liveHtml = liveRows.map(p => _activePipelineCard(p)).join('');
    const staleHtml = staleRows.length
      ? `<div class="text-xs text-amber-300 px-2 mt-2">needs attention</div>
         ${staleRows.map(p => _activePipelineCard(p)).join('')}`
      : '';
    c.innerHTML = liveHtml + staleHtml + completedPreflightHtml;
  } catch (e) { /* ignore transient errors */ }
}

// ─── Activity feed (last few log lines from active pipelines) ───────
async function refreshActivity() {
  try {
    const res = await api('/api/pipelines/active');
    const lines = [];
    const rows = [...(res.rows || []), ...(res.stale_rows || [])].slice(0, 4);
    for (const p of rows) {
      const progress = _evalProgressText(p);
      const status = progress
        ? `${_pipelineStatusText(p)}, ${progress}`
        : _pipelineStatusText(p);
      lines.push(`── ${p.id} (${p.child_node_id || 'no child'}, iter ${p.current_iteration}, ${status}) ──`);
      if (p.log_tail) lines.push(p.log_tail.trim());
    }
    $('#activity-feed').textContent = lines.join('\n');
  } catch { /* ignore */ }
}

// ─── Refresh loop ───────────────────────────────────────────────────
async function refreshAll() {
  try {
    state.tree = await api('/api/tree');
    renderTree(state.tree);
    renderTopbar(state.tree);
  } catch (e) {
    console.warn(e);
  }
  refreshActive();
  refreshActivity();
  if (state.view === 'leaderboard') refreshLeaderboard();
  // Keep the Logs / Commits tabs of the selected node fresh — they pull
  // from on-disk files (run.log, cursor JSONL, effort.md) that the
  // pipeline is actively appending to. Without this, the user would have
  // to re-click the node every 5 seconds to see new events.
  if (state.selectedNodeId) refreshSelectedNodeDetail();
}

// Re-fetch the active node + re-render whichever live tab the user is on.
// "Live" = a tab whose content can change while the user looks at it
// (logs, commits). The other tabs (Overview, Works, Effort, Learnings,
// Prompts) read from `currentNodeData` which we ALSO refresh here, so the
// next time the user flips back to one of those tabs they'll see the
// freshest cached snapshot.
async function refreshSelectedNodeDetail() {
  const id = state.selectedNodeId;
  if (!id) return;
  try {
    const fresh = await api(`/api/node/${id}`);
    // Race guard: by the time the fetch returns the user may have clicked
    // a different node. Drop the stale response.
    if (state.selectedNodeId !== id) return;
    currentNodeData = fresh;
  } catch { /* keep stale data on transient failure */ }
  const activeTab = $('#node-tabs .tab-btn.active')?.dataset?.tab;
  const c = $('#node-tab-content');
  // Logs is push-driven via SSE (see renderLogsTab) — no polling needed.
  if (activeTab === 'commits') {
    renderCommitsTab(c, currentNodeData, { silent: true });
  }
}

refreshAll();
setInterval(refreshAll, 5000);

// SSE: refresh promptly when state.db changes.
try {
  const es = new EventSource('/events');
  es.onmessage = () => refreshAll();
} catch {}
</script>
